name: Deploy Python project to Azure Function App
on:
  push:
    branches: ["main"]

env:
  AZURE_FUNCTIONAPP_NAME: 'DemoFunctionApp'   # set this to your function app name on Azure
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'       # set this to the path to your function app project, defaults to the repository root
  PYTHON_VERSION: '3.11'                    # set this to the python version to use (e.g. '3.9', '3.10', '3.11')

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v4

    - name: Setup Python ${{ env.PYTHON_VERSION }} Environment
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: 'Verify Publish Profile Secret Exists'
      run: |
        if [ -z "${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}" ]; then
          echo "❌ ERROR: AZURE_FUNCTIONAPP_PUBLISH_PROFILE secret is not set"
          exit 1
        fi
        echo "✓ Publish profile secret is configured"

    - name: 'Resolve Project Dependencies Using Pip'
      shell: bash
      run: |
        pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
        python -m pip install --upgrade pip
        pip install -r requirements.txt --target=".python_packages/lib/site-packages"
        popd

    - name: 'Deploy to Azure Functions'
      uses: Azure/functions-action@v1
      id: fa
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        scm-do-build-during-deployment: true
        enable-oryx-build: true

    - name: 'Deployment Summary'
      if: success()
      run: |
        echo "✓ Successfully deployed to ${{ env.AZURE_FUNCTIONAPP_NAME }}"
        echo "Deployment completed at $(date)"

    - name: 'Deployment Failed'
      if: failure()
      run: |
        echo "❌ Deployment failed. Please check:"
        echo "1. AZURE_FUNCTIONAPP_NAME is correct"
        echo "2. AZURE_FUNCTIONAPP_PUBLISH_PROFILE secret is valid and not expired"
        echo "3. Function app still exists in Azure"
        exit 1
